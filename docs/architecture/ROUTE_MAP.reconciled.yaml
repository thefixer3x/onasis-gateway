# =============================================================================
# SUPABASE WIRING
# =============================================================================

supabase:
  project_ref: "mxtsdgkwzjzlttpotole.supabase.co"
  vanity_alias: "lanonasis.supabase.co"

  direct_proxy_routes:
    # These routes go DIRECT from Nginx to Supabase Edge Functions
    # They do NOT go through unified-gateway
    - path_pattern: "/api/v1/auth/status"
      edge_function: "auth-status"
      method: "GET"
    - path_pattern: "/api/v1/intelligence/*"
      edge_function: "intelligence-$1"
      methods: ["GET", "POST"]
    - path_pattern: "/api/v1/profiles/*"
      edge_function: "intelligence-profiles"
      methods: ["GET", "POST"]

  unified_gateway_routes:
    # These routes go through unified-gateway :3000
    # unified-gateway internally proxies to Supabase Edge Functions
    - path_pattern: "/api/v1/memory*"
      note: "unified-gw handles internally"
    - path_pattern: "/api/v1/memories*"
      note: "unified-gw handles internally"
    - path_pattern: "/api/v1/keys*"
      note: "user keys — unified-gw handles"
    - path_pattern: "/api/v1/projects*"
      note: "unified-gw handles"
    - path_pattern: "/api/v1/organizations*"
      note: "unified-gw handles"
    - path_pattern: "/api/v1/config*"
      note: "unified-gw handles"
    - path_pattern: "/api/v1/behavior*"
      note: "unified-gw handles"
    - path_pattern: "/api/v1/embeddings*"
      note: "unified-gw handles"

# =============================================================================
# NETLIFY MIGRATION ROUTE HANDOFF
# =============================================================================

netlify_handoff:
  rules_file: "apps/onasis-core/_redirects"
  netlify_toml: "apps/onasis-core/netlify.toml"
  netlify_functions_dir: "apps/onasis-core/netlify/"

  deprecated_rules:
    - netlify_path: "/.well-known/onasis.json"
      target: "static file"
      new_backend: "nginx_static"

    - netlify_path: "/api/v1/auth/status"
      netlify_function: "auth-api → Supabase"
      new_backend: "Supabase direct auth-status"
      migration_note: "CRITICAL — was routing through auth-api function. Corrected in Rev 2 to go direct to Supabase auth-status EF."

    - netlify_path: "/api/v1/auth/*"
      netlify_function: "auth-api"
      new_backend: "auth-gateway :4000"

    - netlify_path: "/auth/cli-login"
      netlify_function: "cli-auth"
      new_backend: "auth-gateway :4000"

    - netlify_path: "/auth/verify"
      netlify_function: "auth-verify"
      new_backend: "auth-gateway :4000"

    - netlify_path: "/oauth/*"
      netlify_function: "auth-api"
      new_backend: "auth-gateway :4000"

    - netlify_path: "/api/v1/memory*"
      netlify_function: "memory-proxy"
      new_backend: "unified-gateway :3000"

    - netlify_path: "/api/v1/memories*"
      netlify_function: "memory-proxy"
      new_backend: "unified-gateway :3000"

    - netlify_path: "/api/v1/keys/*"
      netlify_function: "maas-api"
      new_backend: "unified-gateway :3000"

    - netlify_path: "/api/v1/projects/*"
      netlify_function: "maas-api"
      new_backend: "unified-gateway :3000"

    - netlify_path: "/api/v1/intelligence/*"
      netlify_function: "api-new"
      new_backend: "Supabase direct intelligence-$1"
      migration_note: "Was going through api-new function. Rev 2 corrected to direct nginx → Supabase."

    - netlify_path: "/api/v1/profiles/*"
      netlify_function: "(Phase 2 — not previously in netlify.toml)"
      new_backend: "Supabase direct intelligence-profiles"
      migration_note: "New in migration plan — Phase 2 profile routes."

    - netlify_path: "/v1/keys/*"
      netlify_function: "key-manager (vendor API keys)"
      new_backend: "unified-gateway :3000"
      migration_note: "Was key-manager.js on Netlify. Critical — was missed in Rev 1 of migration plan."

    - netlify_path: "/mcp*"
      netlify_function: "mcp-sse, mcp-message"
      new_backend: "Lanonasis MCP Server :3104"
      migration_note: "WS/SSE routes go to :3104 (NOT 3002/3003)."

    - netlify_path: "/api/v1/*"
      netlify_function: "maas-api"
      new_backend: "unified-gateway :3000"

    - netlify_path: "/metrics"
      netlify_function: "(none)"
      new_backend: "unified-gateway :3000 (internal only)"
      migration_note: "Not publicly accessible — allow 127.0.0.1 + 10.0.0.0/8 only."

    - netlify_path: "/* (SPA fallback)"
      netlify_function: "index.html"
      new_backend: "nginx static /index.html"

