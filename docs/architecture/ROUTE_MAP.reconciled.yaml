# =============================================================================
# CORS CONFIGURATION
# =============================================================================

cors:
  validated_origins:
    - "https://dashboard.lanonasis.com"
    - "https://mcp.lanonasis.com"
    - "https://api.lanonasis.com"
    - "https://docs.lanonasis.com"
    - "https://lanonasis.com"
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"

  security_note: >
    CORS uses validated whitelist map in nginx — NOT $http_origin reflection.
    Empty string in map = no Access-Control-Allow-Origin header = blocked.
    This prevents CORS poisoning attacks.