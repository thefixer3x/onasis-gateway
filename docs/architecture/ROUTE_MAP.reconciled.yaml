meta:
  version: "2.0"
  supersedes: "2026-01-29 ROUTE_MAP.yaml"
  source: "monorepo plan Rev 2 + live VPS state reconciliation"
  migration_target: "api.lanonasis.com — Netlify → VPS Nginx"

# =============================================================================
# PORTS — Canonical (live on ssh lanonasis-main)
# =============================================================================

ports:
  canonical:
    3000:
      service: unified-gateway
      status: live
      health: "http://localhost:3000/health → {\"status\":\"healthy\",\"api\":{\"services\":5},\"mcp\":{\"adapters\":27,\"tools\":979}}"
      nginx_domain: gateway.lanonasis.com
      notes: "Main API gateway — integrates 85 Supabase Edge Functions"
    3001:
      service: enterprise-mcp
      status: live
      health: "via mcp1.lanonasis.com (not direct)"
      nginx_domain: mcp1.lanonasis.com
      notes: "MCP cluster, enterprise tools"
    3104:
      service: Lanonasis MCP Server
      status: live
      health: "http://localhost:3104/health → {\"status\":\"healthy\",\"service\":\"Lanonasis MCP Server\"}"
      nginx_domain: api.lanonasis.com → /mcp
      notes: "REST + MCP, WS/SSE long-lived connections. WS/SSE routes go HERE."
    4000:
      service: auth-gateway
      status: live
      health: "http://localhost:4000/health → {\"status\":\"ok\",\"service\":\"auth-gateway\",\"outbox\":{\"pending\":2017}}"
      nginx_domain: auth.connectionpoint.tech
      notes: "Auth, sessions, PostgreSQL (local), Redis disabled"
    5001:
      service: vortex-mcp
      status: live
      access: localhost_only
      notes: "Internal only — NOT in Nginx"
    18789:
      service: openclaw-gateway
      status: live
      nginx_domain: control-room.connectionpoint.tech
      notes: "Serves control-room.connectionpoint.tech only"

  retired:
    # DO NOT REUSE — these were placeholders never stood up
    3002:
      was: mcp_core_ws
      reason: "Placeholder from ROUTE_MAP.yaml 2026-01-29. Never stood up. WS/SSE routes go to :3104."
    3003:
      was: mcp_core_sse
      reason: "Placeholder from ROUTE_MAP.yaml 2026-01-29. Never stood up. WS/SSE routes go to :3104."

# =============================================================================
# NGINX ROUTING — api.lanonasis.com (TO BE CREATED on ssh lanonasis-main)
# =============================================================================

nginx_routing:
  api.lanonasis.com:
    ssl_cert: "/etc/letsencrypt/live/api.lanonasis.com/fullchain.pem"
    ssl_key: "/etc/letsencrypt/live/api.lanonasis.com/privkey.pem"

    locations:

      # --- EXACT MATCHES (order critical) ---

      - name: "well-known-onasis-json"
        path: "/.well-known/onasis.json"
        type: "exact"
        backend: "nginx_static"
        config:
          alias: "/opt/lanonasis/lan-onasis-monorepo/apps/onasis-core/public/.well-known/onasis.json"
          content_type: "application/json"
          cache: "public, max-age=300"
          access_log: "off"

      - name: "health"
        path: "/health"
        type: "exact"
        backend: "unified-gateway"
        config:
          upstream: "localhost:3000"
          access_log: "off"

      - name: "auth-status-exact"
        path: "/api/v1/auth/status"
        type: "exact"
        backend: "supabase"
        config:
          supabase_project: "mxtsdgkwzjzlttpotole.supabase.co"
          edge_function: "auth-status"
          proxy_ssl_sni: "on"
          rate_limit: "api_limit:20burst"
          notes: "MUST come before wildcard auth/* block. Direct to Supabase, NOT auth-gateway."

      # --- REGEX ROUTES ---

      - name: "auth-wildcard"
        path: "/api/v1/auth/"
        type: "regex"
        pattern: "^/api/v1/auth/"
        backend: "auth-gateway"
        config:
          upstream: "localhost:4000"
          rate_limit: "auth_limit:10burst"
          notes: "Covers login, register, refresh, api-keys, oauth, CLI"

      - name: "auth-legacy"
        path: "/(auth|oauth)/"
        type: "regex"
        pattern: "^/(auth|oauth)/"
        backend: "auth-gateway"
        config:
          upstream: "localhost:4000"
          rate_limit: "auth_limit:10burst"
          notes: "Legacy paths: cli-login, verify, PKCE flows"

      - name: "intelligence"
        path: "/api/v1/intelligence/"
        type: "regex"
        pattern: "^/api/v1/intelligence/(.+)$"
        backend: "supabase"
        config:
          supabase_project: "mxtsdgkwzjzlttpotole.supabase.co"
          rewrite: "/functions/v1/intelligence-$1"
          rate_limit: "api_limit:10burst"
          proxy_ssl_sni: "on"
          notes: "Direct nginx → Supabase Edge Functions. NOT through unified-gateway."

      - name: "profiles"
        path: "/api/v1/profiles/"
        type: "regex"
        pattern: "^/api/v1/profiles/(.+)$"
        backend: "supabase"
        config:
          supabase_project: "mxtsdgkwzjzlttpotole.supabase.co"
          rewrite: "/functions/v1/intelligence-profiles/$1"
          rate_limit: "api_limit:10burst"
          proxy_ssl_sni: "on"
          notes: "Phase 2. Single EF parses path suffix to determine operation."

      - name: "memory-main-api"
        path: "/api/v1/(memories|memory|keys|projects|organizations|organization|config|behavior|embeddings)"
        type: "regex"
        pattern: "^/api/v1/(memories|memory|keys|projects|organizations|organization|config|behavior|embeddings)(/|$)"
        backend: "unified-gateway"
        config:
          upstream: "localhost:3000"
          rate_limit: "memory_limit:50burst"
          notes: "unified-gateway internally proxies to Supabase Edge Functions"

      - name: "vendor-keys"
        path: "/v1/keys/"
        type: "regex"
        pattern: "^/v1/keys/"
        backend: "unified-gateway"
        config:
          upstream: "localhost:3000"
          rate_limit: "auth_limit:5burst"
          notes: "Vendor API key management. Was Netlify key-manager.js. NOT /api/v1/keys/*."

      - name: "api-v1-catchall"
        path: "/api/v1/"
        type: "prefix"
        backend: "unified-gateway"
        config:
          upstream: "localhost:3000"
          rate_limit: "api_limit:20burst"
          notes: "Catch-all for any unlisted /api/v1/* routes"

      - name: "mcp-ws-sse"
        path: "/mcp"
        type: "prefix"
        backend: "lanonasis-mcp-server"
        config:
          upstream: "localhost:3104"
          upgrade_header: "$http_upgrade"
          connection_header: "upgrade"
          read_timeout: "86400s"
          send_timeout: "86400s"
          buffering: "off"
          notes: "WS/SSE long-lived. Goes to port 3104 (Lanonasis MCP Server), NOT 3002/3003."

      - name: "metrics"
        path: "/metrics"
        type: "prefix"
        backend: "unified-gateway"
        config:
          upstream: "localhost:3000"
          allow: ["127.0.0.1", "10.0.0.0/8"]
          deny: "all"
          access_log: "off"
          notes: "Internal only — not publicly accessible"

      - name: "auth-web-ui"
        path: "/(auth/web|login|signup)"
        type: "regex"
        pattern: "^/(auth/web|login|signup)"
        backend: "nginx_static"
        config:
          try_files: "/auth.html =404"
          notes: "Web UI only — returns auth.html. API auth routes are above."

      - name: "static-assets"
        path: "/*.(css|js|svg|ico|png|jpg|jpeg|webp|woff|woff2|ttf|eot)"
        type: "regex"
        backend: "nginx_static"
        config:
          expires: "1y"
          cache_control: "public, max-age=31536000, immutable"
          access_log: "off"

      - name: "root-spa"
        path: "/"
        type: "prefix"
        backend: "nginx_static"
        config:
          try_files: "$uri $uri/ /index.html"
          notes: "Landing page SPA fallback"

