# proxy-headers.conf — reference snippet for shared proxy headers
#
# Drop into /etc/nginx/snippets/ on the VPS, then include from any
# location that proxies to an upstream:
#
#     location /api/ {
#         include snippets/proxy-headers.conf;
#         proxy_pass http://central_gateway;
#     }
#
# Header propagation model is defined in
# docs/architecture/TRUST_BOUNDARIES.md. Do not relax the
# X-Forwarded-* fields without re-reading that document.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Connection header for upstream keepalive (per gateway.conf upstreams).
proxy_set_header Connection        "";

# Long timeouts for slow Supabase / MaaS paths.
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering       off;