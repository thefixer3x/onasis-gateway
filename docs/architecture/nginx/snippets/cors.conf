# cors.conf — unified CORS policy for the onasis-gateway.
#
# This is the SINGLE source of truth for CORS handling across the gateway.
# All backends (central-gateway :3000, auth-gateway :4000, enterprise-mcp :3001,
# mcp-core :3001-3003) MUST disable their own CORS handling so this snippet
# is the only policy in the request path.
#
# Include from any location that returns CORS-sensitive responses:
#
#     location /api/ {
#         include snippets/cors.conf;
#         ...
#     }
#
# The allow-list is intentionally explicit. Per TRUST_BOUNDARIES.md,
# wildcard `*` is NOT used because auth-bearing responses must never be
# cached or echoed by arbitrary origins.

# Default — same-origin only.
set $cors_origin "";

# Production web app.
if ($http_origin = "https://lanonasis.com") {
    set $cors_origin $http_origin;
}
if ($http_origin = "https://www.lanonasis.com") {
    set $cors_origin $http_origin;
}

# Vortex Shield / gateway console.
if ($http_origin = "https://vortexshield.lanonasis.com") {
    set $cors_origin $http_origin;
}

# Development origins (staging only — remove for production).
if ($http_origin = "http://localhost:3000") {
    set $cors_origin $http_origin;
}
if ($http_origin = "http://localhost:5173") {
    set $cors_origin $http_origin;
}

# Echo only when origin is on the allow-list.
add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials "true"   always;
add_header Vary                              "Origin" always;

# Allowed methods / headers — apply on preflight only.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, X-Api-Key, X-Org-Id" always;
    add_header Access-Control-Max-Age       "86400" always;
    add_header Content-Length                0;
    add_header Content-Type                  "text/plain";
    return 204;
}