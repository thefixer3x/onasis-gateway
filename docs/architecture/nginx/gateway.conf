# =============================================================================
# gateway.lanonasis.com — Unified Nginx Gateway (production v2)
# =============================================================================
# Replaces: Netlify CDN + _redirects + Netlify Functions
# Behavioral source: docs/architecture/NGINX-BEHAVIORAL-MAP.md
# VPS upstream layout (from deploy/*):
#   auth_backend    :4000 / :4001  (canonical auth-gateway)
#   memory_backend  :3000          (unified-gateway / central gateway)
#   mcp_backend     :3104          (Lanonasis MCP Server)
#   enterprise_mcp  :3001          (enterprise MCP prototype)
# =============================================================================
#
# Note: maps/limit_req_zone/log_format must live in http context (nginx.conf).
# Zone names prefixed with gw_ to avoid conflicts during transition with api.lanonasis.com.conf.
# =============================================================================

# === CORS — validated origin whitelist (NOT $http_origin reflection) ===
map $http_origin $cors_origin {
    default "";
    "https://app.lanonasis.com"              "https://app.lanonasis.com";
    "https://dashboard.lanonasis.com"         "https://dashboard.lanonasis.com";
    "https://admin.lanonasis.com"             "https://admin.lanonasis.com";
    "https://gateway.lanonasis.com"           "https://gateway.lanonasis.com";
    "https://api.lanonasis.com"               "https://api.lanonasis.com";
    "https://auth.lanonasis.com"              "https://auth.lanonasis.com";
    "https://mcp.lanonasis.com"               "https://mcp.lanonasis.com";
    "https://docs.lanonasis.com"              "https://docs.lanonasis.com";
    "https://lanonasis.com"                   "https://lanonasis.com";
    "http://localhost:3000"                   "http://localhost:3000";
    "http://localhost:4000"                   "http://localhost:4000";
    "http://localhost:5173"                   "http://localhost:5173";
}

# === RATE LIMITING ZONES ===
limit_req_zone $binary_remote_addr zone=gw_general:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=gw_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=gw_api:10m       rate=50r/s;
limit_req_zone $binary_remote_addr zone=gw_memory:10m    rate=100r/m;
limit_req_zone $binary_remote_addr zone=gw_intel:10m     rate=20r/m;
limit_conn_zone $binary_remote_addr zone=gw_ws_conn:10m;

# === STRUCTURED JSON LOGGING ===
log_format gateway_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"response_time":$request_time,'
    '"upstream":"$upstream_addr",'
    '"user_agent":"$http_user_agent"'
'}';

# === UPSTREAMS ===
upstream auth_backend {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=30s backup;
    keepalive 64;
}

upstream memory_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream mcp_backend {
    server 100.98.62.115:3104 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream enterprise_mcp {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# === SUPABASE VANITY DOMAINS ===
# lanonasis.supabase.co — Main project (vanity)
# mxtsdgkwzjzlttpotole.supabase.co — Intel project

# =============================================================================
# MAIN HTTPS SERVER — gateway.lanonasis.com
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.lanonasis.com;

    # === SSL — Certbot-managed (auto-renewal enabled) ===
    ssl_certificate /etc/letsencrypt/live/gateway.lanonasis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.lanonasis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === SECURITY HEADERS ===
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === CORS (validated origin whitelist) ===
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,X-API-Key,apikey,X-Project-Scope" always;
    add_header Vary Origin always;

    # CORS preflight — return 204 immediately; server-level add_header sends CORS headers
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # === REQUEST ID ===
    add_header X-Request-ID $request_id always;

    # === LOGGING ===
    access_log /var/log/nginx/gateway_access.json gateway_json;
    error_log /var/log/nginx/gateway_error.log warn;

    client_max_body_size 10M;

    # =====================================================================
    # STATIC FILES — service discovery, auth UI, landing page
    # Netlify equivalent: _redirects static rules + netlify.toml SPA fallback
    # =====================================================================

    root /opt/lanonasis/lan-onasis-monorepo/apps/onasis-core;

    # Service discovery JSON
    location = /.well-known/onasis.json {
        alias /opt/lanonasis/lan-onasis-monorepo/apps/onasis-core/public/.well-known/onasis.json;
        add_header Content-Type application/json;
        add_header Cache-Control "public, max-age=300";
        access_log off;
    }

    # Auth pages
    location ~ ^/(auth/web|login|signup) {
        try_files /auth.html =404;
    }

    # Static assets with long cache
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    # =====================================================================
    # FAMILY 9: HEALTH — gateway-level (no auth)
    # Netlify equivalent: /health, /api/v1/health → health function
    # =====================================================================

    location = /health {
        proxy_pass http://memory_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /api/v1/health {
        proxy_pass http://memory_backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /info {
        proxy_pass http://memory_backend/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth health
    location = /auth/health {
        proxy_pass http://auth_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =====================================================================
    # FAMILY 3 & 4: AUTH GATEWAY — all auth/callback routes → :4000
    # Netlify equivalent: auth-api, cli-auth, dashboard-callback, auth-verify, etc.
    # Decided: no Netlify function replication — all proxy_pass to canonical auth-gateway
    # =====================================================================

    # Auth status → Supabase direct (EXACT match before wildcard)
    location = /api/v1/auth/status {
        limit_req zone=gw_auth burst=20 nodelay;
        proxy_pass https://lanonasis.supabase.co/functions/v1/auth-status;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
        proxy_read_timeout 30s;
    }

    # All /api/v1/auth/* → auth-gateway (login, register, refresh, logout, verify, etc.)
    location ~ ^/api/v1/auth/ {
        limit_req zone=gw_auth burst=20 nodelay;
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cookie;
        proxy_read_timeout 60s;
    }

    # /v1/auth/* → auth-gateway (fallback for non-/api/ path)
    location ~ ^/v1/auth/ {
        limit_req zone=gw_auth burst=20 nodelay;
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cookie;
    }

    # OAuth endpoints
    location ~ ^/oauth/ {
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # OAuth callback (formerly 301 on Netlify — now transparent proxy)
    location = /auth/callback {
        proxy_pass http://auth_backend/v1/auth/oauth/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # CLI authentication
    location ~ ^/(auth/cli-login|api/cli-auth) {
        limit_req zone=gw_auth burst=10 nodelay;
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Dashboard auth callback
    location ~ ^/(auth/dashboard/callback|dashboard/auth/callback) {
        rewrite ^ /v1/auth/dashboard/callback break;
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Auth verify
    location = /auth/verify {
        proxy_pass http://auth_backend/v1/auth/verify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Auth gateway introspection
    location = /api/v1/auth/introspect {
        proxy_pass http://auth_backend/oauth/introspect;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # RESTful API key management (auth-gateway owns this)
    location ~ ^/api/v1/api-keys {
        proxy_pass http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # =====================================================================
    # FAMILY 6: INTELLIGENCE API — direct to Supabase Edge Functions
    # Netlify equivalent: 14 200! redirects → mxtsdgkwzjzlttpotole.supabase.co
    # =====================================================================

    location ~ ^/api/v1/intelligence/(.+)$ {
        limit_req zone=gw_intel burst=10 nodelay;

        rewrite ^/api/v1/intelligence/(.+)$ /functions/v1/intelligence-$1 break;

        proxy_pass https://mxtsdgkwzjzlttpotole.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host mxtsdgkwzjzlttpotole.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Content-Type $http_content_type;
        proxy_read_timeout 120s;
    }

    # =====================================================================
    # FAMILY 5: ORG, PROJECTS, CONFIG — direct to Supabase Edge Functions
    # Netlify equivalent: 12 200! redirects → lanonasis.supabase.co
    # =====================================================================

    # Organization info → Supabase
    location ~ ^/api/v1/(organization|organizations)(/|$) {
        limit_req zone=gw_api burst=20 nodelay;
        rewrite ^ /functions/v1/organization-info break;
        proxy_pass https://lanonasis.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
    }

    location ~ ^/api/v1/org(/|$) {
        limit_req zone=gw_api burst=20 nodelay;
        rewrite ^ /functions/v1/organization-info break;
        proxy_pass https://lanonasis.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
    }

    # Projects → Supabase
    location ~ ^/api/v1/projects(/|$) {
        limit_req zone=gw_api burst=20 nodelay;
        # Route based on path suffix — rewrite to correct EF
        if ($uri ~ ^/api/v1/projects/list) {
            rewrite ^ /functions/v1/project-list break;
            proxy_pass https://lanonasis.supabase.co;
        }
        if ($uri ~ ^/api/v1/projects/create) {
            rewrite ^ /functions/v1/project-create break;
            proxy_pass https://lanonasis.supabase.co;
        }
        # Default: POST to /api/v1/projects → project-create
        rewrite ^ /functions/v1/project-create break;
        proxy_pass https://lanonasis.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
    }

    # Config → Supabase
    location ~ ^/api/v1/config(/|$) {
        limit_req zone=gw_api burst=20 nodelay;
        # Route based on path suffix
        if ($uri ~ ^/api/v1/config/set) {
            rewrite ^ /functions/v1/config-set break;
            proxy_pass https://lanonasis.supabase.co;
        }
        # /api/v1/config, /api/v1/config/get, /api/v1/config/:key → config-get
        rewrite ^ /functions/v1/config-get break;
        proxy_pass https://lanonasis.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
    }

    # =====================================================================
    # FAMILY 2: API KEYS — direct to Supabase Edge Functions
    # Netlify equivalent: 6 200! redirects → lanonasis.supabase.co
    # NOTE: /api/v1/api-keys/* (RESTful path) routes to auth-gateway above.
    #       /api/v1/keys/* (MCP tool path) routes to Supabase EFs here.
    # =====================================================================

    location ~ ^/api/v1/keys(/|$) {
        limit_req zone=gw_api burst=20 nodelay;
        # Route based on path suffix
        if ($uri ~ ^/api/v1/keys/list) {
            rewrite ^ /functions/v1/api-key-list break;
            proxy_pass https://lanonasis.supabase.co;
        }
        if ($uri ~ ^/api/v1/keys/create) {
            rewrite ^ /functions/v1/api-key-create break;
            proxy_pass https://lanonasis.supabase.co;
        }
        if ($uri ~ ^/api/v1/keys/rotate) {
            rewrite ^ /functions/v1/api-key-rotate break;
            proxy_pass https://lanonasis.supabase.co;
        }
        if ($uri ~ ^/api/v1/keys/revoke) {
            rewrite ^ /functions/v1/api-key-revoke break;
            proxy_pass https://lanonasis.supabase.co;
        }
        if ($uri ~ ^/api/v1/keys/delete) {
            rewrite ^ /functions/v1/api-key-delete break;
            proxy_pass https://lanonasis.supabase.co;
        }
        # Default: POST /api/v1/keys → api-key-create
        rewrite ^ /functions/v1/api-key-create break;
        proxy_pass https://lanonasis.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
    }

    # =====================================================================
    # FAMILY 1: MEMORY API → unified-gateway (handles path normalization)
    # Netlify equivalent: 20 rules → memory-proxy.js + maas-api.js
    # =====================================================================

    location ~ ^/api/v1/(memory|memories)(/|$) {
        limit_req zone=gw_memory burst=50 nodelay;
        proxy_pass http://memory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Project-Scope $http_x_project_scope;
        proxy_read_timeout 60s;
    }

    # =====================================================================
    # FAMILY 5 (cont): EMBEDDINGS → Supabase
    # =====================================================================

    location = /api/v1/embeddings {
        proxy_pass https://lanonasis.supabase.co/functions/v1/embeddings;
        proxy_ssl_server_name on;
        proxy_set_header Host lanonasis.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header apikey $http_apikey;
        proxy_read_timeout 60s;
    }

    # =====================================================================
    # FAMILY 8: VENDOR API KEYS → unified-gateway (key-manager.js equivalent)
    # Netlify equivalent: key-manager.js (AES-256-GCM encryption)
    # =====================================================================

    location ~ ^/v1/keys/ {
        limit_req zone=gw_auth burst=5 nodelay;
        proxy_pass http://memory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 30s;
    }

    # =====================================================================
    # FAMILY 7: MCP ROUTES — WebSocket, SSE, message
    # Netlify equivalent: /ws, /sse, /message, /api/mcp → mcp-message.js
    # =====================================================================

    # MCP WebSocket
    location /mcp/ws {
        limit_conn gw_ws_conn 10;
        proxy_pass http://mcp_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Generic WS (alias)
    location /ws {
        limit_conn gw_ws_conn 10;
        proxy_pass http://mcp_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP SSE
    location /sse {
        proxy_pass http://mcp_backend/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header Content-Type 'text/event-stream';
        proxy_set_header X-Accel-Buffering 'no';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP events (alias)
    location /api/v1/events {
        proxy_pass http://mcp_backend/api/v1/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # MCP message handling
    location /message {
        proxy_pass http://mcp_backend/message;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # MCP generic routes
    location /mcp {
        proxy_pass http://mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400s;
    }

    # API MCP fallback
    location /api/mcp {
        proxy_pass http://mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # =====================================================================
    # FAMILY 7 (cont): DOCS MCP — proxy to docs.lanonasis.com
    # =====================================================================

    location ~ ^/(api/v1/)?(mcp/)?docs/mcp {
        rewrite ^ /api/mcp break;
        proxy_pass https://docs.lanonasis.com;
        proxy_http_version 1.1;
        proxy_set_header Host docs.lanonasis.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # =====================================================================
    # FAMILY 7 (cont): ENTERPRISE MCP
    # =====================================================================

    location /api/mcp/enterprise/ {
        proxy_pass http://enterprise_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================================================================
    # FAMILY 8 (cont): LEGACY MAAS CATCH-ALL → unified-gateway
    # Netlify equivalent: /api/v1/maas/* → maas-api.js (Netlify function)
    # =====================================================================

    location ~ ^/api/v1/maas/ {
        proxy_pass http://memory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # =====================================================================
    # FAMILY 7: PROFILES — direct to Supabase (Phase 2)
    # Netlify equivalent (deprecated): /api/v1/profiles/* → intelligence-profiles EF
    # =====================================================================

    location ~ ^/api/v1/profiles/(.+)$ {
        limit_req zone=gw_api burst=10 nodelay;
        rewrite ^/api/v1/profiles/(.+)$ /functions/v1/intelligence-profiles/$1 break;
        proxy_pass https://mxtsdgkwzjzlttpotole.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header Host mxtsdgkwzjzlttpotole.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Content-Type $http_content_type;
        proxy_read_timeout 120s;
    }

    # =====================================================================
    # FAMILY 10: V1 CATCH-ALL → unified-gateway (any unlisted routes)
    # =====================================================================

    location /api/v1/ {
        limit_req zone=gw_api burst=20 nodelay;
        proxy_pass http://memory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # =====================================================================
    # METRICS — internal only
    # =====================================================================

    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://memory_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =====================================================================
    # ROOT — SPA fallback / landing page
    # =====================================================================

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# HTTP redirect → HTTPS
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name gateway.lanonasis.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
